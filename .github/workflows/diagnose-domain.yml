name: Diagnose current domain routing
on:
  push:
    branches: [migration/hostinger-preview]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DNS and HTTP
        run: |
          echo "CNAME:"
          dig +short CNAME jennydb.shopandhire.net
          echo "A:"
          dig +short A jennydb.shopandhire.net
          echo "HTTP:"
          curl -sS -L -D - -o /tmp/jenny-response.html --max-time 20 https://jennydb.shopandhire.net/ | head -35
          head -c 300 /tmp/jenny-response.html
